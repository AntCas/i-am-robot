<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register your site | I'm a robot</title>
  <link rel="icon" type="image/svg+xml" href="/im-a-robot/favicon.svg">
  <link rel="stylesheet" href="/im-a-robot/styles.css">
</head>
<body>
  <main class="copy-page register-page">
    <h1 class="copy-title">Widget Installation</h1>
    <p class="register-lead">
      Install our widget on any website to prevent humans from using your service
    </p>

    <section class="register-card" aria-labelledby="register-form-title">
      <form class="register-form" data-role="register-form">
        <label class="message-board-label">
          Website hostname
          <input
            type="text"
            name="hostname"
            required
            placeholder="example.com"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="url"
          >
        </label>

        <div class="register-form-row">
          <button type="submit" data-role="submit-button">Generate embed code</button>
          <p class="register-form-status muted" data-role="form-status"></p>
        </div>
      </form>
    </section>

    <section class="register-card hidden" aria-labelledby="register-result-title" data-role="result-card">
      <div class="register-card-header">
        <h2 id="register-result-title">Embed code</h2>
      </div>

      <div class="register-snippet">
        <label class="message-board-label">
          Copy this snippet into your website
          <textarea rows="12" readonly data-role="embed-code"></textarea>
        </label>

        <div class="register-form-row">
          <button type="button" data-role="copy-button">Copy embed code</button>
          <p class="register-form-status muted" data-role="copy-status"></p>
        </div>
      </div>
    </section>

    <p class="copy-back"><a href="/im-a-robot">Back to the demo</a></p>
  </main>

  <script type="module" src="/im-a-robot/register.js"></script>
</body>
</html>
